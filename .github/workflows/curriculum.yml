name: Curriculum regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless browser and Chinese glyphs
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Real HTTP loader, all chapters, mobile and source anchors
        run: python tests/test_curriculum.py --verify-sources
      - name: Save tracked website snapshot for reproducible review
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip -o artifacts/source-snapshot.zip HEAD
      - name: Upload review report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-review
          path: artifacts/
          retention-days: 7
